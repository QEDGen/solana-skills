[package]
name = "vault"
version = "0.1.0"
edition = "2021"

# `[workspace]` so the staged copy does not get absorbed by the repo
# workspace when the gate stages it into a tempdir.
[workspace]

# The generated integration test is written to `tests/integration_tests.rs`
# and imports this crate as `vault as program`, so the package name must
# match the spec's program name.
[lib]
name = "vault"
path = "src/lib.rs"

[dependencies]
parallax-svm = { git = "https://github.com/blueshift-gg/parallax", rev = "804c5662832c65330e7299901cc5195a78d87256" }
wincode = { version = "0.5", features = ["derive"] }

# `qedgen codegen --integration` upserts the Parallax dev-dependency set
# into this section. It is left empty on purpose: the gate asserts that the
# upsert fills it, so pre-populating it would hide a regression.
[dev-dependencies]
