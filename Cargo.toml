[workspace]
members = [
    "crates/qedgen",
    "crates/qedgen-hash-core",
    "crates/qedgen-macros",
    "crates/qedgen-sandbox",
    "crates/qed-drift-fixture",
    "crates/kani-compile-stub",
    "crates/kani-compile-stub/macros",
]
exclude = [
    "examples/rust/escrow",
    "examples/rust/lending",
    "examples/rust/multisig",
    "examples/rust/brownfield-onboarding/program",
    # #182: the vendored Kani prelude carries no `[workspace]` (it is delivered
    # nested inside host harness packages); exclude it here so a standalone
    # `cd kani_prelude && cargo kani` still resolves it.
    "kani_prelude",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
syn = { version = "2", features = ["full", "parsing", "visit", "fold", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
toml = "0.8"
