# qedgen-kani-prelude — the soundness core for QEDGen's Kani abstractions (#182).
#
# The Kani twin of `lean_solana/`: a single source of truth for the reusable,
# spec-INDEPENDENT abstractions that `qedgen codegen --kani`/`--kani-impl` today
# re-inline into every harness (Pubkey `==`/`cmp`, `checked_div`, the `mul_div`
# helpers, and the PDA / log / CPI over-approximation stubs). Here they are
# written ONCE and machine-checked sound, so downstream harnesses can import
# rather than regenerate them.
#
# Empty `[workspace]` opts this crate OUT of the parent qedgen workspace so
# `cargo kani` resolves it independently (same trick the generated harness
# crates use). It is verification-only: `#![cfg(kani)]` makes a plain
# `cargo build`/`cargo test` compile an empty crate; the bodies + proofs exist
# only under `cargo kani`. Deliberately DEPENDENCY-FREE — the soundness lemmas
# are byte-level (`Pubkey` is a `[u8; 32]` newtype), so no anchor-lang /
# solana-program in the graph, no version-unification, and a fast solver run.
[package]
name = "qedgen-kani-prelude"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["lib"]
