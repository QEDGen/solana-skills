name: Skill distribution

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skills: ['1.5.9', '1.7.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check committed runtime skill inventory
        run: python3 scripts/package-skills.py --check
      - name: Test portable inventory and installer
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Install pinned skills CLI for compatibility tests
        run: npm install --prefix "$RUNNER_TEMP/skills-cli" --ignore-scripts --no-audit --no-fund "skills@${{ matrix.skills }}"
      - name: Build QEDGen binary for portable smoke test
        run: cargo build --locked --release --bin qedgen
      - name: Test discovery, install, replacement, and migration
        env:
          SKILLS_VERSION: ${{ matrix.skills }}
        run: |
          migration_args=(--migration)
          if [[ "$SKILLS_VERSION" == '1.5.9' ]]; then
            migration_args+=(--expect-migration-blocked)
          fi
          python3 scripts/test-skills-cli.py \
            --cli "$RUNNER_TEMP/skills-cli/node_modules/skills/bin/cli.mjs" \
            --qedgen "$GITHUB_WORKSPACE/target/release/qedgen" \
            "${migration_args[@]}"
