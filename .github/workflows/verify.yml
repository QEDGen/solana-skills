name: Formal Verification

on:
  # Temporarily manual-only. The expensive repository-wide example proof sweep
  # lives in lake-build.yml; this workflow remains available for a root proof
  # project if one is added again.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean
        uses: leanprover/lean4-action@v1

      - name: Cache lake packages
        uses: actions/cache@v4
        with:
          path: formal_verification/.lake
          key: lake-${{ hashFiles('formal_verification/lean-toolchain', 'formal_verification/lakefile.lean') }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install qedgen
        run: cargo install --path crates/qedgen

      - name: Build proofs
        run: cd formal_verification && lake build

      - name: Check spec coverage
        run: qedgen check --spec program.qedspec
