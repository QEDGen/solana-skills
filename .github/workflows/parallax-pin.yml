name: Parallax pin liveness

# `parallax-svm` is not published to crates.io, so the generated integration
# scaffold pins a git revision. When that revision stops existing upstream
# (force-push, rebase, deleted branch), every scaffold qedgen has generated
# stops resolving its dev-dependencies — in the USER's crate, not ours.
#
# That failure has nothing to do with releases, so checking it only at
# release time (#371) left it unwatched for however long sits between cuts.
#
# Its own workflow rather than a job in `ci.yml`: adding `schedule` to that
# file would put the whole matrix on a timer for one network probe.
on:
  schedule:
    # Weekly. The failing condition is an upstream force-push, not routine
    # churn, so a tighter cadence buys nothing.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  parallax-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The script's exit codes are already automation-shaped, so this step
      # is the whole job:
      #   0 = current, or behind upstream (expected — pinning is the point),
      #       or upstream unreachable (offline / rate limit / flake)
      #   1 = the pinned revision is gone; the dependency will not resolve
      #   2 = the pin could not be read, so the check stopped checking
      #
      # Exit 2 fails on purpose. A check that silently stops checking is
      # worse than no check, because it still reports green.
      - name: Check the pinned Parallax revision still exists
        run: bash scripts/check-parallax-pin.sh
